<style>
:root{--bg:#f4efe6;--fg:#1b1b1f;--card:#fff;--ac:#b8862b;--lane:#00000012;--logo-f:none;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141216;--fg:#f2ede4;--card:#221f26;--ac:#e0b34e;--lane:#ffffff14;--logo-f:invert(1)}}
:root[data-theme="dark"]{--bg:#141216;--fg:#f2ede4;--card:#221f26;--ac:#e0b34e;--lane:#ffffff14;--logo-f:invert(1)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}

<h1>🎵 탱고 리듬 트레이너</h1>
<p>박자에 맞춰 <b>왼쪽/오른쪽</b> 화면을 탭하세요(키보드는 F, J). <b>금색 노트(양쪽 동시)</b>가 마디의 강박입니다.</p>
<div id="drive" style="display:none"><p><b>☁ 곡 목록</b> (누르면 자동 다운로드)</p><div id="songs" style="max-height:200px;overflow:auto"></div><button class="sub" id="reload" style="padding:8px;font-size:13px">목록 새로고침</button></div>
<label class="btn sub" for="file" style="background:transparent;color:var(--fg);border:1px solid var(--ac)">내 기기에서 채보 파일(.osz) 선택</label>
<input id="file" type="file" style="display:none">
<p id="msg"></p>
<div id="diffs"></div>
<label>노트 속도 <span id="spv">1.0</span><input id="sp" type="range" min="0.6" max="2" step="0.1" value="1"></label>
<label>타이밍 보정 <span id="ofv">0</span>ms<input id="of" type="range" min="-150" max="150" step="5" value="0"></label>
<button id="go" disabled>시작</button>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=s=>document.querySelector(s),cv=$('#c'),g=cv.getContext('2d'),LEAD=3000,KEYS=['f','j'],N=2;
let W,H,zip,charts=[],sel=null,ctx,src,t0,notes=[],st=null,flash=[0,0],raf;
function rs(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
$('#sp').oninput=e=>$('#spv').textContent=(+e.target.value).toFixed(1);
$('#of').oninput=e=>$('#ofv').textContent=e.target.value;
function parse(t){let sec='',c={ver:'',title:'',audio:'',cs:4,mode:0,objs:[]};
 for(let l of t.split(/\r?\n/)){l=l.trim();if(!l||l.startsWith('//'))continue;
  if(l[0]==='['){sec=l;continue}
  if(sec==='[HitObjects]'){const p=l.split(',');c.objs.push({x:+p[0],t:+p[2]})}
  else{const i=l.indexOf(':');if(i<0)continue;const k=l.slice(0,i).trim(),v=l.slice(i+1).trim();
   if(k==='AudioFilename')c.audio=v;else if(k==='Version')c.ver=v;else if(k==='Title')c.title=v;
   else if(k==='CircleSize')c.cs=+v;else if(k==='Mode')c.mode=+v}}
 return c}
async function openOsz(data){const m=$('#msg');m.textContent='불러오는 중…';
 try{zip=await JSZip.loadAsync(data);charts=[];
  for(const n of Object.keys(zip.files)){if(/\.osu$/i.test(n)){const c=parse(await zip.files[n].async('string'));if(c.mode===3&&(c.cs===4||c.cs===2)&&c.objs.length)charts.push(c)}}
  if(!charts.length)throw new Error('2키/4키 마니아 채보를 찾지 못했어요');
  const d=$('#diffs');d.innerHTML='';
  charts.forEach((c,i)=>{const b=document.createElement('button');b.className='sub';b.textContent=c.title+' ['+c.ver+'] · 노트 '+c.objs.length;
   b.onclick=()=>{sel=c;[...d.children].forEach(x=>x.className='sub');b.className='on'};d.appendChild(b);if(!i)b.click()});
  m.textContent='';$('#go').disabled=false;
 }catch(err){m.textContent='⚠ '+(err.message||err);$('#go').disabled=true}}
$('#file').onchange=e=>{const f=e.target.files[0];if(f)openOsz(f)};
$('#go').onclick=async()=>{const m=$('#msg');
 try{ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();
  const key=Object.keys(zip.files).find(n=>n.toLowerCase()===sel.audio.toLowerCase());
  if(!key)throw new Error('음악 파일을 찾지 못했어요');
  m.textContent='음악 준비 중…';
  const ab=await zip.files[key].async('arraybuffer');
  const buf=await new Promise((ok,no)=>ctx.decodeAudioData(ab,ok,no));
  notes=sel.objs.map(o=>({t:o.t,l:sel.cs===2?Math.min(1,Math.floor(o.x*2/512)):Math.min(3,Math.floor(o.x*4/512))>>1,done:0}));
  notes=notes.filter((n,i,a)=>a.findIndex(o=>o.t===n.t&&o.l===n.l)===i);
  notes.forEach(n=>n.acc=notes.some(o=>o!==n&&o.t===n.t));
  notes.sort((a,b)=>a.t-b.t);
  st={sc:0,n:0,combo:0,max:0,j:'',jt:0,cnt:{P:0,G:0,O:0,M:0},sp:+$('#sp').value,off:+$('#of').value,end:notes[notes.length-1].t+1500};
  src=ctx.createBufferSource();src.buffer=buf;src.connect(ctx.destination);
  t0=ctx.currentTime+0.1;src.start(t0+LEAD/1000);
  $('#menu').style.display='none';m.textContent='';loop();
 }catch(err){m.textContent='⚠ '+(err.message||err)}};
/* ===== 곡 목록 (웹 호스팅 songs/index.json 우선, 없으면 구글드라이브 API 키) ===== */
const DRIVE_FOLDER='1i90MsdIjoeHf7C84WnICxdQeN-tzDXrU';
const API_KEY='';/* (선택) 구글드라이브 방식: 구글 API 키 */
const GAPI='https://www.googleapis.com/drive/v3/files';
async function dList(id){const q=encodeURIComponent("'"+id+"' in parents and trashed=false");
 const r=await fetch(GAPI+'?q='+q+'&fields=files(id,name,mimeType,size)&pageSize=200&orderBy=name&key='+API_KEY);
 if(!r.ok)throw new Error('목록을 불러오지 못했어요 ('+r.status+')');return (await r.json()).files||[]}
async function hostSongs(){if(!/^https?:/.test(location.protocol))return null;
 try{const r=await fetch('songs/index.json',{cache:'no-cache'});if(!r.ok)return null;const j=await r.json();
  return j.map(n=>({name:n,get:async()=>{const x=await fetch('songs/'+encodeURIComponent(n));if(!x.ok)throw new Error('다운로드 실패 ('+x.status+')');return x.arrayBuffer()}}))}catch(e){return null}}
async function driveSongs(){const root=await dList(DRIVE_FOLDER);let fl=root.filter(f=>/\.osz$/i.test(f.name));
 for(const d of root.filter(f=>f.mimeType==='application/vnd.google-apps.folder'&&/^songs?$/i.test(f.name)))fl=fl.concat((await dList(d.id)).filter(f=>/\.osz$/i.test(f.name)));
 return fl.map(f=>({name:f.name,size:f.size,get:async()=>{const r=await fetch(GAPI+'/'+f.id+'?alt=media&key='+API_KEY);if(!r.ok)throw new Error('다운로드 실패 ('+r.status+')');return r.arrayBuffer()}}))}
async function loadSongs(){const box=$('#songs');box.innerHTML='<p>불러오는 중…</p>';
 try{const items=(await hostSongs())||(API_KEY?await driveSongs():[]);
  box.innerHTML='';if(!items.length){box.innerHTML='<p>곡이 없어요</p>';return}
  items.forEach(f=>{const b=document.createElement('button');b.className='sub';b.style.padding='10px';b.style.fontSize='14px';
   b.textContent=f.name.replace(/\.osz$/i,'')+(f.size?'  ('+(f.size/1048576).toFixed(1)+'MB)':'');
   b.onclick=async()=>{[...box.children].forEach(x=>x.className='sub');b.className='on';const m=$('#msg');$('#go').disabled=true;m.textContent='다운로드 중…';
    try{await openOsz(await f.get())}catch(err){m.textContent='⚠ '+(err.message||err)}};
   box.appendChild(b)});
 }catch(err){box.innerHTML='<p>⚠ '+(err.message||err)+'</p>'}}
(async()=>{$('#reload').onclick=loadSongs;
 if(API_KEY||await hostSongs()){$('#drive').style.display='block';loadSongs()}})();
const now=()=>(ctx.currentTime-t0)*1000-LEAD+st.off;
const geom=()=>{const sw=Math.min(W,380);return{sw,x0:(W-sw)/2,hy:H*0.68}};
function judge(l){if(!st||!ctx)return;flash[l]=1;const t=now();let b=null;
 for(const n of notes){if(n.done||n.l!==l)continue;if(n.t>t+135)break;if(Math.abs(n.t-t)<=135&&(!b||Math.abs(n.t-t)<Math.abs(b.t-t)))b=n}
 if(!b)return;const d=Math.abs(b.t-t);b.done=1;
 const r=d<=45?['PERFECT',100,'P']:d<=90?['GREAT',70,'G']:['GOOD',40,'O'];
 st.sc+=r[1];st.n++;st.cnt[r[2]]++;st.combo++;st.max=Math.max(st.max,st.combo);st.j=r[0]+(d>20?(t>b.t?' · 늦음':' · 빠름'):'');st.jt=performance.now()}
function laneAt(x){const{sw,x0}=geom();const i=Math.floor((x-x0)/(sw/N));return i>=0&&i<N?i:-1}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const l=laneAt(e.clientX);if(l>=0)judge(l)});
addEventListener('keydown',e=>{if(e.repeat)return;const l=KEYS.indexOf(e.key.toLowerCase());if(l>=0)judge(l)});
function loop(){const t=now(),{sw,x0,hy}=geom(),lw=sw/N,ppm=H*0.0008*st.sp;
 for(const n of notes)if(!n.done&&t-n.t>135){n.done=1;st.n++;st.cnt.M++;st.combo=0;st.j='MISS';st.jt=performance.now()}
 g.clearRect(0,0,W,H);
 for(let i=0;i<N;i++){g.fillStyle=getComputedStyle(document.body).getPropertyValue('--lane')||'#8882';g.fillRect(x0+i*lw+1,0,lw-2,H);
  if(flash[i]>0){g.fillStyle='rgba(224,179,78,'+flash[i]*0.3+')';g.fillRect(x0+i*lw+1,0,lw-2,H);flash[i]=Math.max(0,flash[i]-0.08)}}
 const ac=getComputedStyle(document.body).getPropertyValue('--ac').trim()||'#e0b34e',fg=getComputedStyle(document.body).color;
 for(const n of notes){if(n.done)continue;const y=hy-(n.t-t)*ppm;if(y<-30)break;if(y>H+30)continue;
  g.fillStyle=n.acc?ac:fg;g.globalAlpha=n.acc?1:0.75;g.beginPath();g.roundRect(x0+n.l*lw+8,y-13,lw-16,26,10);g.fill();g.globalAlpha=1}
 g.fillStyle=ac;g.fillRect(x0,hy-5,sw,10);
 g.textAlign='center';g.fillStyle=fg;g.font='bold 34px sans-serif';if(st.combo>1)g.fillText(st.combo,W/2,H*0.32);
 if(performance.now()-st.jt<500){g.font='bold 20px sans-serif';g.fillStyle=ac;g.fillText(st.j,W/2,H*0.32+30)}
 g.font='14px sans-serif';g.fillStyle=fg;g.textAlign='left';g.fillText('정확도 '+(st.n?(st.sc/st.n).toFixed(1):'100.0')+'%',x0+8,24);
 if(t<0){g.textAlign='center';g.font='bold 28px sans-serif';g.fillStyle=ac;g.fillText('준비… '+Math.ceil(-t/1000),W/2,H*0.5)}
 if(t>st.end){end();return}raf=requestAnimationFrame(loop)}
function end(){try{src.stop()}catch(e){}ctx.close();const a=st.n?(st.sc/st.n).toFixed(1):'0';
 $('#menu').style.display='flex';$('#msg').innerHTML='<b>결과 · 정확도 '+a+'%</b><br>PERFECT '+st.cnt.P+' · GREAT '+st.cnt.G+' · GOOD '+st.cnt.O+' · MISS '+st.cnt.M+'<br>최대 콤보 '+st.max;st=null}
</script></body></html>
